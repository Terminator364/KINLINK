name: android-0.7.1-candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
permissions:
  contents: read

concurrency:
  group: android-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Fail-open API fence
        run: |
          set -euo pipefail
          SRC="app/src/main/java"
          forbidden='bindProcessToNetwork|setProcessDefaultNetwork|reportNetworkConnectivity|requestNetwork\(|VpnService'
          if grep -R -n -E "$forbidden" "$SRC"; then
            echo "Forbidden network-ownership API found in production source."
            exit 1
          fi
          echo "Fail-open API fence passed."
      - name: Manifest safety fence
        run: |
          set -euo pipefail
          MANIFEST="app/src/main/AndroidManifest.xml"
          forbidden_permissions='android.permission.CHANGE_NETWORK_STATE|android.permission.CHANGE_WIFI_STATE|android.permission.MODIFY_PHONE_STATE|android.permission.WRITE_SETTINGS'
          if grep -E -q "$forbidden_permissions" "$MANIFEST"; then
            echo "A network-affecting Android permission is forbidden for the KINLINK fail-open baseline."
            grep -E -n "$forbidden_permissions" "$MANIFEST" || true
            exit 1
          fi
          if grep -q 'android.net.VpnService' "$MANIFEST"; then
            echo "VpnService is forbidden until separately qualified."
            exit 1
          fi
          echo "Manifest safety fence passed."
      - name: Background wakeup fence
        run: |
          set -euo pipefail
          SRC="app/src/main/java"
          forbidden_wakeup='AlarmManager|WorkManager|PeriodicWorkRequest|ScheduledExecutorService|scheduleAtFixedRate|TimerTask'
          if grep -R -n -E "$forbidden_wakeup" "$SRC"; then
            echo "Repeating/background wakeup scheduler found in production source."
            exit 1
          fi
          echo "Background wakeup fence passed: no repeating scheduler API found."
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Build unsigned release-like candidate APK
        run: gradle :app:assembleCandidate --stacktrace
      - name: Candidate package identity and unsigned fence
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/candidate/app-candidate-unsigned.apk"
          test -f "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$BUILD_TOOLS"
          test -x "$BUILD_TOOLS/aapt"
          test -x "$BUILD_TOOLS/apksigner"

          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='com.terminator364.kinlink'"
          echo "$BADGING" | grep -F "versionCode='9'"
          echo "$BADGING" | grep -F "versionName='0.7.1'"

          set +e
          VERIFY_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose "$APK" 2>&1)"
          VERIFY_RC=$?
          set -e
          if [ "$VERIFY_RC" -eq 0 ]; then
            echo "Candidate APK is unexpectedly signed. Public CI must emit an unsigned artifact."
            exit 1
          fi
          if ! printf '%s\n' "$VERIFY_OUTPUT" | grep -Eqi 'DOES NOT VERIFY|No signatures'; then
            echo "Could not prove the candidate is merely unsigned; refusing artifact."
            printf '%s\n' "$VERIFY_OUTPUT"
            exit 1
          fi
          echo "Candidate identity PASS and unsigned fence PASS."
      - name: SHA-256
        run: |
          sha256sum app/build/outputs/apk/candidate/app-candidate-unsigned.apk | tee app/build/outputs/apk/candidate/KINLINK-candidate-unsigned.apk.sha256
          cat > app/build/outputs/apk/candidate/KINLINK-build-manifest.json <<EOF
          {
            "product": "KINLINK",
            "version": "0.7.1",
            "variant": "candidate-unsigned",
            "commit": "${GITHUB_SHA}",
            "built_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "verification": "CI build and unit tests passed; stable-sign promotion and field verification pending"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: KINLINK-0.7.1-ci-build
          path: |
            app/build/outputs/apk/candidate/app-candidate-unsigned.apk
            app/build/outputs/apk/candidate/KINLINK-candidate-unsigned.apk.sha256
            app/build/outputs/apk/candidate/KINLINK-build-manifest.json
          retention-days: 7
