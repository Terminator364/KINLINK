name: android-rc3
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Fail-open API fence
        run: |
          set -euo pipefail
          SRC="app/src/main/java"
          forbidden='bindProcessToNetwork|setProcessDefaultNetwork|reportNetworkConnectivity|requestNetwork\(|VpnService'
          if grep -R -n -E "$forbidden" "$SRC"; then
            echo "Forbidden network-ownership API found in production source."
            exit 1
          fi
          echo "Fail-open API fence passed."
      - name: Manifest safety fence
        run: |
          set -euo pipefail
          MANIFEST="app/src/main/AndroidManifest.xml"
          if grep -q 'android.permission.CHANGE_NETWORK_STATE' "$MANIFEST"; then
            echo "CHANGE_NETWORK_STATE is forbidden for KINLINK fail-open baseline."
            exit 1
          fi
          if grep -q 'android.net.VpnService' "$MANIFEST"; then
            echo "VpnService is forbidden until separately qualified."
            exit 1
          fi
          echo "Manifest safety fence passed."
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build CI debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: SHA-256
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/KINLINK-debug.apk.sha256
          cat > app/build/outputs/apk/debug/KINLINK-build-manifest.json <<EOF
          {
            "product": "KINLINK",
            "version": "0.6.0-rc3",
            "variant": "debug-ci",
            "commit": "${GITHUB_SHA}",
            "built_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "verification": "CI build and unit tests passed; stable-sign promotion and field verification pending"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: KINLINK-rc3-ci-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/KINLINK-debug.apk.sha256
            app/build/outputs/apk/debug/KINLINK-build-manifest.json
          retention-days: 7
