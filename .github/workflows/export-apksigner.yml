name: export-apksigner-tool

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/export-apksigner.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Locate public Android apksigner tool
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -n 1)"
          if [ -z "$JAR" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
            JAR="$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -n 1)"
          fi
          test -n "$JAR"
          cp "$JAR" apksigner.jar
          sha256sum apksigner.jar > apksigner.jar.sha256
          java -jar apksigner.jar version

      - uses: actions/upload-artifact@v4
        with:
          name: KINLINK-apksigner-tool
          path: |
            apksigner.jar
            apksigner.jar.sha256
          retention-days: 7
