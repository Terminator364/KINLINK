name: design-lint
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: design-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
              print('OK', p)
          PY
      - name: Required design files
        run: |
          test -f project_state.json
          test -f docs/CANONICAL_SPEC.md
          test -f docs/ARCHITECTURE.md
          test -f docs/FAIL_OPEN_AND_RECOVERY.md
          test -f docs/TELEMETRY_AND_DIAGNOSTICS.md
          test -f docs/REQUIREMENTS_TRACEABILITY.md
          test -f docs/DELIVERY_SECURITY_AND_INSTALLATION.md
          test -f .project-memory/DELIVERY_SECURITY_POLICY.json
          test -f .project-memory/CONTINUITY_CONTEXT_MANIFEST.json
          test -f .project-memory/RESUME_CAPSULE.json
          test -f .project-memory/PRECONCEPTION_BASELINE_A.json
          test -f .project-memory/FULL_REQUIREMENTS_LEDGER.json
          test -f .project-memory/PRODUCT_EVOLUTION_C.json
          test -f docs/FULL_PRODUCT_SPEC_A_B_C.md
          test -f docs/B_EXPANSION_V2.md
          test -f .project-memory/B_EXPANSION_LEDGER.json
          test -f .project-memory/MEMORY_POLICY_V2.json
          test -f .project-memory/PROJECT_CHRONICLE.jsonl
          test -f .project-memory/CANONICAL_CONTEXT_PACK.json
          test -f .project-memory/SUPERSESSION_LEDGER.json
      - name: Deterministic resume capsule contract
        run: python tools/release/verify_resume_capsule.py
      - name: Cold takeover state reconciliation
        run: python tools/release/verify_cold_takeover.py
      - name: Full A+B+C continuity context contract
        run: python tools/release/verify_continuity_context.py
      - name: Project memory integrity contract
        run: python tools/release/verify_memory_integrity.py
      - name: Communication protocol contract
        run: python tools/release/verify_communication_protocol.py
      - name: Delivery security contract
        run: python tools/release/verify_delivery_security.py
      - name: Execute telemetry migration simulation
        run: python tools/release/verify_telemetry_migrations.py
      - name: Historical 0.7.0 readiness ledger consistency
        run: python tools/release/verify_release_readiness.py --audit
      - name: Active 0.7.1 readiness ledger consistency
        run: python tools/release/verify_release_readiness.py --ledger .project-memory/RELEASE_READINESS_0_7_1_DEV.json --audit
      - name: 0.7.1 candidate contract counter-audit
        run: python tools/release/verify_candidate_contract.py
      - name: Release evidence hash integrity
        run: python tools/release/verify_release_evidence_integrity.py
      - name: Canonical signer continuity contract
        run: python tools/release/verify_signer_contract.py
      - name: Public-repo private signing material fence
        run: |
          set -euo pipefail
          leaked="$(find . -type f \( -iname '*.p12' -o -iname '*.pfx' -o -iname '*.jks' -o -iname '*.keystore' -o -iname '*SIGNING_CREDENTIALS*' \) -not -path './.git/*' -print)"
          if [ -n "$leaked" ]; then
            echo "Private signing material or credential file must never exist in the public repository:"
            echo "$leaked"
            exit 1
          fi
          echo "Private signing material fence passed."
